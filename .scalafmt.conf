# Light-touch config aligned with Apache Spark's conventions: enforce the 100-column limit, no
# aligned tokens, single-line imports, Asterisk docstrings, and no dangling parentheses, while
# preserving the hand-authored line breaks (Spark keeps deliberate fluent-call and signature
# layouts rather than letting the formatter explode them).
version = "3.8.3"
runner.dialect = scala213

maxColumn = 100
newlines.source = keep
align.preset = none
importSelectors = singleLine
danglingParentheses.preset = false
docstrings.style = Asterisk
docstrings.wrap = false
trailingCommas = never
